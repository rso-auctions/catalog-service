# Application
quarkus.application.name=catalog-service
# All endpoints live under /catalog so the API gateway can route by path prefix.
quarkus.http.root-path=/catalog
%dev.quarkus.http.port=8081
# Random port in tests, so tests never clash with a running dev instance.
quarkus.http.test-port=0

# Datasource
# In dev and test mode Quarkus Dev Services starts PostgreSQL in Docker. In prod the connection comes from
# QUARKUS_DATASOURCE_JDBC_URL, QUARKUS_DATASOURCE_USERNAME and QUARKUS_DATASOURCE_PASSWORD.
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.schema-management.strategy=none

# Multitenancy: one database schema per tenant, chosen per request by SchemaTenantResolver.
quarkus.hibernate-orm.multitenant=SCHEMA
# No default in prod: every deployment must name its tenants (RSO_TENANTS_IDS), otherwise startup fails.
%dev.rso.tenants.ids=avto,tech
%test.rso.tenants.ids=avto,tech

# Liquibase
# TenantSchemaMigrator applies the changelog to every tenant schema; the built-in migration would only cover
# the default schema.
quarkus.liquibase.change-log=db/changelog/db.changelog-master.xml
quarkus.liquibase.migrate-at-start=false

# OpenAPI
quarkus.smallrye-openapi.info-title=Catalog Service API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Items, categories and listing moderation for RSO Auctions.
quarkus.swagger-ui.always-include=true

# Application
quarkus.application.name=catalog-service
# All endpoints live under /catalog so the API gateway can route by path prefix.
quarkus.http.root-path=/catalog
%dev.quarkus.http.port=8081
# Random port in tests, so tests never clash with a running dev instance.
quarkus.http.test-port=0

# OpenAPI
quarkus.smallrye-openapi.info-title=Catalog Service API
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Items, categories and listing moderation for RSO Auctions.
quarkus.swagger-ui.always-include=true
